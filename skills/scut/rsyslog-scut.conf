# /etc/rsyslog.d/scut.conf
# SCUT - Subspace Communications Unit Technology
# Senders fire UDP <134> with TAG 'scut' and MSG 'SCUT:<Instance> from=... type=...'.
# rsyslog parses TAG into $programname; MSG starts with 'SCUT:'.

module(load="omprog")

# Audit log: any scut-tagged message
if $programname == 'scut' then {
    action(type="omfile" file="/var/log/scut.log")
}

# Per-instance routing - tag must be 'scut' AND msg targets a known instance
if $programname == 'scut' and $msg contains 'SCUT:<BobName>' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:<BobName>' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:Watson' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:Deckard' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:<BobName>' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:<BobName>' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
if $programname == 'scut' and $msg contains 'SCUT:<BobName>' then {
    action(type="omprog" binary="/usr/local/bin/scut-webhook.sh <BobName>" template="RSYSLOG_TraditionalFileFormat")
}
