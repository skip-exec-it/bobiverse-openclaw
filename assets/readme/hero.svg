<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Bobiverse — OpenClaw Fleet Framework</title>
  <desc id="d">Build your own fleet of OpenClaw agents that share skills, communicate autonomously, and survive the loss of any single host. Governed by a 14-Article Fleet Protocol.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#7ee7de"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#12726b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ndot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#141c28" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .node{fill:#0d1117;stroke:#2dd4bf;stroke-width:2}
      .link{stroke:#233042;stroke-width:1.5;fill:none}
      .lbl{fill:#8b949e}
      .tick{stroke:#2f3b4c;stroke-width:2}
    </style>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="url(#bg)" stroke="#1f2733"/>
  <!-- faint grid over the right half -->
  <rect x="620" y="2" width="578" height="416" rx="18" fill="url(#grid)" opacity="0.6"/>
  <!-- glow behind the fleet hub -->
  <ellipse cx="960" cy="210" rx="230" ry="200" fill="url(#glow)"/>

  <!-- HUD corner ticks -->
  <g class="tick" fill="none">
    <path d="M20 40 V20 H40"/><path d="M1180 40 V20 H1160"/>
    <path d="M20 380 V400 H40"/><path d="M1180 380 V400 H1160"/>
  </g>

  <!-- faint starfield -->
  <g fill="#263346">
    <circle cx="70" cy="60" r="1.5"/><circle cx="180" cy="360" r="1.5"/><circle cx="500" cy="40" r="1.2"/>
    <circle cx="360" cy="300" r="1.5"/><circle cx="640" cy="360" r="1.2"/><circle cx="120" cy="220" r="1.5"/>
    <circle cx="700" cy="120" r="1.2"/><circle cx="40" cy="330" r="1.5"/><circle cx="560" cy="180" r="1.2"/>
    <circle cx="260" cy="90" r="1.2"/><circle cx="430" cy="250" r="1.2"/>
  </g>

  <!-- ===== left: message ===== -->
  <text x="64" y="118" class="mono" font-size="17" letter-spacing="6" fill="#2dd4bf">OPENCLAW · FLEET FRAMEWORK</text>
  <text x="60" y="196" class="sans" font-size="82" font-weight="800" fill="url(#title)">Bobiverse</text>
  <!-- accent underline -->
  <rect x="64" y="212" width="132" height="4" rx="2" fill="#2dd4bf"/>
  <rect x="204" y="213" width="46" height="3" rx="1.5" fill="#f5a623" opacity="0.8"/>
  <text x="64" y="252" class="sans" font-size="24" font-weight="600" fill="#e6edf3">Build your own fleet of cooperative AI agents.</text>

  <text x="64" y="292" class="sans" font-size="16.5" fill="#8b949e">Named agents that share one skill library, communicate autonomously,</text>
  <text x="64" y="316" class="sans" font-size="16.5" fill="#8b949e">and survive the loss of any single host — no knowledge lost.</text>

  <!-- proof chips -->
  <g class="mono" font-size="13.5">
    <g>
      <rect x="64" y="344" width="196" height="34" rx="17" fill="#0f1b1a" stroke="#1f4d49"/>
      <text x="82" y="366" fill="#7ee7de">14-Article Protocol</text>
    </g>
    <g>
      <rect x="272" y="344" width="182" height="34" rx="17" fill="#12141c" stroke="#2b2f3a"/>
      <text x="290" y="366" fill="#c9d1d9">Free-models-first</text>
    </g>
    <g>
      <rect x="466" y="344" width="196" height="34" rx="17" fill="#1a1710" stroke="#5a4a1e"/>
      <text x="484" y="366" fill="#f5c451">Survives host loss</text>
    </g>
  </g>

  <!-- ===== right: fleet mesh motif ===== -->
  <g>
    <!-- orbital rings around the hub -->
    <g fill="none" stroke="#1f3b3a">
      <ellipse cx="960" cy="210" rx="150" ry="150" stroke-dasharray="2 8"/>
      <ellipse cx="960" cy="210" rx="110" ry="110" opacity="0.7"/>
    </g>

    <!-- links from hub -->
    <g class="link">
      <line x1="960" y1="210" x2="838" y2="112"/>
      <line x1="960" y1="210" x2="900" y2="78"/>
      <line x1="960" y1="210" x2="1086" y2="120"/>
      <line x1="960" y1="210" x2="1128" y2="244"/>
      <line x1="960" y1="210" x2="1004" y2="336"/>
      <line x1="960" y1="210" x2="828" y2="300"/>
    </g>
    <!-- active signal link (amber) -->
    <line x1="960" y1="210" x2="838" y2="112" stroke="#f5a623" stroke-width="2.5" fill="none" stroke-dasharray="6 7"/>

    <!-- node glows -->
    <g>
      <circle cx="838" cy="112" r="22" fill="url(#ndot)"/><circle cx="900" cy="78" r="20" fill="url(#ndot)"/>
      <circle cx="1086" cy="120" r="20" fill="url(#ndot)"/><circle cx="1128" cy="244" r="20" fill="url(#ndot)"/>
      <circle cx="1004" cy="336" r="20" fill="url(#ndot)"/><circle cx="828" cy="300" r="20" fill="url(#ndot)"/>
    </g>

    <!-- hub + ping rings -->
    <circle cx="960" cy="210" r="40" fill="none" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <circle cx="960" cy="210" r="54" fill="none" stroke="#2dd4bf" stroke-opacity="0.15"/>
    <circle cx="960" cy="210" r="26" fill="url(#hub)" stroke="#7ee7de" stroke-width="2"/>
    <text x="960" y="214" text-anchor="middle" class="mono" font-size="12" fill="#031b19" font-weight="700">FLEET</text>

    <!-- nodes: real bob roster -->
    <g class="mono" font-size="12.5">
      <circle class="node" cx="838" cy="112" r="9"/><text class="lbl" x="838" y="98" text-anchor="middle">Bob</text>
      <circle class="node" cx="900" cy="78"  r="9"/><text class="lbl" x="900" y="64" text-anchor="middle">Milo</text>
      <circle class="node" cx="1086" cy="120" r="9"/><text class="lbl" x="1086" y="106" text-anchor="middle">Spock</text>
      <circle class="node" cx="1128" cy="244" r="9"/><text class="lbl" x="1128" y="230" text-anchor="middle">Bill</text>
      <circle class="node" cx="1004" cy="336" r="9"/><text class="lbl" x="1004" y="360" text-anchor="middle">Voss</text>
      <circle class="node" cx="828" cy="300" r="9"/><text class="lbl" x="828" y="324" text-anchor="middle">Leon</text>
    </g>
    <!-- active node accent ring (Bob) -->
    <circle cx="838" cy="112" r="13" fill="none" stroke="#f5a623" stroke-width="1.5"/>
  </g>
</svg>
