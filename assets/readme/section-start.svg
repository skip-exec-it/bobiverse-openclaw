<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Quick start</title>
  <desc id="d">Section: from zero to a running bob in three steps.</desc>
  <defs>
    <pattern id="d4" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#182230"/></pattern>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="118" rx="14" fill="#0d1117" stroke="#1f2733"/>
  <rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#d4)"/>
  <rect x="1" y="1" width="6" height="118" rx="3" fill="#2dd4bf"/>
  <text x="690" y="104" class="sans" font-size="120" font-weight="800" fill="#121a24" opacity="0.8">04</text>
  <g stroke="#2f3b4c" stroke-width="1.5" fill="none"><path d="M1176 14 V26 M1176 14 H1164"/><path d="M1176 106 V94 M1176 106 H1164"/></g>

  <!-- step pips -->
  <g><circle cx="44" cy="42" r="3" fill="#2dd4bf"/><circle cx="58" cy="42" r="3" fill="#2dd4bf" opacity="0.6"/><circle cx="72" cy="42" r="3" fill="#2dd4bf" opacity="0.3"/></g>
  <text x="86" y="47" class="mono" font-size="13" letter-spacing="4" fill="#2dd4bf">04 · GET STARTED</text>
  <text x="38" y="86" class="sans" font-size="34" font-weight="800" fill="#e6edf3">Quick start</text>

  <!-- motif: terminal with prompt + cursor + glow -->
  <ellipse cx="1050" cy="60" rx="130" ry="60" fill="url(#g4)"/>
  <g transform="translate(950,30)">
    <rect x="0" y="0" width="210" height="60" rx="8" fill="#010409" stroke="#1f2733"/>
    <rect x="0" y="0" width="210" height="18" rx="8" fill="#0d1117"/>
    <circle cx="14" cy="10" r="3.5" fill="#f5a623"/><circle cx="26" cy="10" r="3.5" fill="#2dd4bf"/><circle cx="38" cy="10" r="3.5" fill="#233042"/>
    <text x="14" y="40" class="mono" font-size="13" fill="#7ee7de">$ <tspan fill="#c9d1d9">clone-a-bob</tspan></text>
    <rect x="150" y="30" width="9" height="13" fill="#2dd4bf"/>
    <text x="14" y="56" class="mono" font-size="11" fill="#3fae6a">✓ bob online</text>
  </g>
</svg>
