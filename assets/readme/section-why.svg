<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Why it's different</title>
  <desc id="d">Section: hard-won design lessons — the fleet survives host loss and keeps working.</desc>
  <defs>
    <pattern id="d2" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#221c12"/></pattern>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f5a623" stop-opacity="0.2"/><stop offset="1" stop-color="#f5a623" stop-opacity="0"/></radialGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="118" rx="14" fill="#0d1117" stroke="#1f2733"/>
  <rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#d2)"/>
  <rect x="1" y="1" width="6" height="118" rx="3" fill="#f5a623"/>
  <text x="690" y="104" class="sans" font-size="120" font-weight="800" fill="#1c1710" opacity="0.85">02</text>
  <g stroke="#3a3320" stroke-width="1.5" fill="none"><path d="M1176 14 V26 M1176 14 H1164"/><path d="M1176 106 V94 M1176 106 H1164"/></g>

  <text x="40" y="48" class="mono" font-size="13" letter-spacing="4" fill="#f5a623">02 · WHY IT'S DIFFERENT</text>
  <text x="38" y="86" class="sans" font-size="34" font-weight="800" fill="#e6edf3">Hard-won design lessons</text>

  <!-- motif: one node lost, mesh reroutes (survives host loss) -->
  <ellipse cx="1010" cy="60" rx="120" ry="70" fill="url(#g2)"/>
  <g transform="translate(1010,60)">
    <g stroke="#233042" stroke-width="1.5">
      <line x1="0" y1="0" x2="-60" y2="-26"/><line x1="0" y1="0" x2="66" y2="16"/><line x1="0" y1="0" x2="-40" y2="32"/>
    </g>
    <!-- rerouted active link bypassing the lost node -->
    <path d="M -60 -26 L -40 32" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-dasharray="5 6"/>
    <!-- lost node (dimmed, dashed) with X -->
    <circle cx="52" cy="-30" r="7" fill="#0d1117" stroke="#3a2a12" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M48 -34 l8 8 M56 -34 l-8 8" stroke="#5a4a1e" stroke-width="1.5"/>
    <g fill="#0d1117" stroke="#2dd4bf" stroke-width="2">
      <circle cx="-60" cy="-26" r="7"/><circle cx="66" cy="16" r="7"/><circle cx="-40" cy="32" r="7"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f5a623" stroke-opacity="0.22"/>
    <circle cx="0" cy="0" r="12" fill="#12726b" stroke="#7ee7de" stroke-width="2"/>
  </g>
</svg>
